<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #F4F6F9; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1A2B45; -webkit-font-smoothing: antialiased; }
    a { color: #1CA0E3; } a:hover { color: #0A2A5E; }
  </style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 64px 72px 56px; display: flex; flex-direction: column; justify-content: space-between; background: #F4F6F9;">
  <div style="display: flex; flex-direction: column; gap: 22px;">
    <img src="lusu-logo.png" alt="LUSU" style="height: 116px; width: auto; align-self: flex-start;">
    <div style="font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #1CA0E3;">Staff training</div>
    <h1 style="margin: 0; font-size: 76px; line-height: 1; font-weight: 800; letter-spacing: -.01em; color: #0A2A5E;">Visa Reconciliation</h1>
    <p style="margin: 0; max-width: 780px; font-size: 26px; line-height: 1.4; color: #6B7A90; text-wrap: pretty;">How to reconcile your LUSU Visa card each month, from the statement landing in your inbox to final approval.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #6B7A90;">Every reconciliation moves through these statuses</div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span style="display: inline-block; padding: 6px 16px; border-radius: 14px; font-size: 16px; font-weight: 700; background: #ECEFF3; color: #5A6B82;">Draft</span>
      <svg width="30" height="14" viewBox="0 0 30 14" fill="none" stroke="#6B7A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h26M21 1l6 6-6 6"></path></svg>
      <span style="display: inline-block; padding: 6px 16px; border-radius: 14px; font-size: 16px; font-weight: 700; background: #1CA0E3; color: #FFFFFF;">Submitted</span>
      <svg width="30" height="14" viewBox="0 0 30 14" fill="none" stroke="#6B7A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h26M21 1l6 6-6 6"></path></svg>
      <span style="display: inline-block; padding: 6px 16px; border-radius: 14px; font-size: 16px; font-weight: 700; background: #0A2A5E; color: #FFFFFF;">Ed Review</span>
      <svg width="30" height="14" viewBox="0 0 30 14" fill="none" stroke="#6B7A90" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 7h26M21 1l6 6-6 6"></path></svg>
      <span style="display: inline-block; padding: 6px 16px; border-radius: 14px; font-size: 16px; font-weight: 700; background: #2E7D32; color: #FFFFFF;">Approved</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
